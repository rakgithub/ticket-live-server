services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ticket_live}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-role-bootstrap:
    image: postgres:16-alpine
    profiles: ["bootstrap"]
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/bootstrap-service-roles.sh"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-password}
      PGDATABASE: ${POSTGRES_DB:-ticket_live}
      TICKETLIVE_PUBLIC_API_DB_PASSWORD: ${TICKETLIVE_PUBLIC_API_DB_PASSWORD:-local-public-api-password}
      TICKETLIVE_IDENTITY_DB_PASSWORD: ${TICKETLIVE_IDENTITY_DB_PASSWORD:-local-identity-password}
      TICKETLIVE_ORDER_DB_PASSWORD: ${TICKETLIVE_ORDER_DB_PASSWORD:-local-order-password}
      TICKETLIVE_EVENT_DB_PASSWORD: ${TICKETLIVE_EVENT_DB_PASSWORD:-local-event-password}
      TICKETLIVE_EMAIL_DB_PASSWORD: ${TICKETLIVE_EMAIL_DB_PASSWORD:-local-email-password}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./docker/postgres:/scripts:ro

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  elasticsearch_data:
  rabbitmq_data:
