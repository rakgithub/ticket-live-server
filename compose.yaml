x-app-image: &app-image
  image: ticket-live-app:local
  build:
    context: .
    target: runtime

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ticket_live}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-role-bootstrap:
    image: postgres:16-alpine
    profiles: ["bootstrap"]
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/bootstrap-service-roles.sh"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-password}
      PGDATABASE: ${POSTGRES_DB:-ticket_live}
      TICKETLIVE_PUBLIC_API_DB_PASSWORD: ${TICKETLIVE_PUBLIC_API_DB_PASSWORD:-local-public-api-password}
      TICKETLIVE_IDENTITY_DB_PASSWORD: ${TICKETLIVE_IDENTITY_DB_PASSWORD:-local-identity-password}
      TICKETLIVE_ORDER_DB_PASSWORD: ${TICKETLIVE_ORDER_DB_PASSWORD:-local-order-password}
      TICKETLIVE_EVENT_DB_PASSWORD: ${TICKETLIVE_EVENT_DB_PASSWORD:-local-event-password}
      TICKETLIVE_EMAIL_DB_PASSWORD: ${TICKETLIVE_EMAIL_DB_PASSWORD:-local-email-password}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./docker/postgres:/scripts:ro

  migrations:
    image: ticket-live-migrations:local
    build:
      context: .
      target: migrations
    profiles: ["tooling"]
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-ticket_live}
    depends_on:
      postgres:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER:-ticketlive-local-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:-local-rabbit-admin-password}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:15692:15692"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq-role-bootstrap:
    image: node:24-alpine
    profiles: ["bootstrap"]
    restart: "no"
    command: ["node", "/scripts/bootstrap-users.mjs"]
    environment:
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_ADMIN_USER: ${RABBITMQ_ADMIN_USER:-ticketlive-local-admin}
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD:-local-rabbit-admin-password}
      TICKETLIVE_ORDER_AMQP_USER: ${TICKETLIVE_ORDER_AMQP_USER:-ticketlive-order}
      TICKETLIVE_ORDER_AMQP_PASSWORD: ${TICKETLIVE_ORDER_AMQP_PASSWORD:-local-order-amqp-password}
      TICKETLIVE_EMAIL_AMQP_USER: ${TICKETLIVE_EMAIL_AMQP_USER:-ticketlive-email}
      TICKETLIVE_EMAIL_AMQP_PASSWORD: ${TICKETLIVE_EMAIL_AMQP_PASSWORD:-local-email-amqp-password}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./docker/rabbitmq:/scripts:ro

  event-service:
    <<: *app-image
    profiles: ["apps"]
    restart: unless-stopped
    environment:
      NODE_ENV: development
      TICKETLIVE_SERVICE: event
      EVENT_SERVICE_PORT: 4003
      EVENT_SERVICE_DATABASE_URL: postgres://ticketlive_event:${TICKETLIVE_EVENT_DB_PASSWORD:-local-event-password}@postgres:5432/${POSTGRES_DB:-ticket_live}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EVENT_CHAT_MODEL: ${EVENT_CHAT_MODEL:-gemini-3.8-flash}
      PUBLIC_API_EVENT_TOKEN: ${PUBLIC_API_EVENT_TOKEN:-local-public-api-event-token-change-me-32chars}
      ORDER_EVENT_TOKEN: ${ORDER_EVENT_TOKEN:-local-order-event-token-change-me-32chars}
      RABBITMQ_AUTO_DECLARE_TOPOLOGY: "true"
    ports:
      - "127.0.0.1:4003:4003"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4003/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12

  order-service:
    <<: *app-image
    profiles: ["apps"]
    restart: unless-stopped
    environment:
      NODE_ENV: development
      TICKETLIVE_SERVICE: order
      ORDER_SERVICE_PORT: 4005
      ORDER_SERVICE_DATABASE_URL: postgres://ticketlive_order:${TICKETLIVE_ORDER_DB_PASSWORD:-local-order-password}@postgres:5432/${POSTGRES_DB:-ticket_live}
      EVENT_SERVICE_URL: http://event-service:4003
      INVENTORY_SERVICE_URL: http://event-service:4003
      ORDER_EVENT_TOKEN: ${ORDER_EVENT_TOKEN:-local-order-event-token-change-me-32chars}
      ORDER_AMQP_URL: amqp://${TICKETLIVE_ORDER_AMQP_USER:-ticketlive-order}:${TICKETLIVE_ORDER_AMQP_PASSWORD:-local-order-amqp-password}@rabbitmq:5672/%2F
      RABBITMQ_AUTO_DECLARE_TOPOLOGY: "true"
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-2000}
      INVENTORY_RECONCILIATION_INTERVAL_MS: ${INVENTORY_RECONCILIATION_INTERVAL_MS:-60000}
    ports:
      - "127.0.0.1:4005:4005"
    depends_on:
      postgres:
        condition: service_healthy
      event-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4005/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12

  email-service:
    <<: *app-image
    profiles: ["apps"]
    restart: unless-stopped
    environment:
      NODE_ENV: development
      TICKETLIVE_SERVICE: email
      EMAIL_SERVICE_PORT: 4004
      EMAIL_SERVICE_DATABASE_URL: postgres://ticketlive_email:${TICKETLIVE_EMAIL_DB_PASSWORD:-local-email-password}@postgres:5432/${POSTGRES_DB:-ticket_live}
      EMAIL_INTERNAL_TOKEN: ${EMAIL_INTERNAL_TOKEN:-local-email-internal-token-change-me-32chars}
      EMAIL_AMQP_URL: amqp://${TICKETLIVE_EMAIL_AMQP_USER:-ticketlive-email}:${TICKETLIVE_EMAIL_AMQP_PASSWORD:-local-email-amqp-password}@rabbitmq:5672/%2F
      RABBITMQ_AUTO_DECLARE_TOPOLOGY: "true"
      EMAIL_PROVIDER: fake
      EMAIL_LEGACY_QUEUE_ENABLED: ${EMAIL_LEGACY_QUEUE_ENABLED:-true}
      EMAIL_RETRY_DELAY_MS: ${EMAIL_RETRY_DELAY_MS:-30000}
      EMAIL_MAX_RETRIES: ${EMAIL_MAX_RETRIES:-5}
    ports:
      - "127.0.0.1:4004:4004"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4004/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12

  public-api:
    <<: *app-image
    profiles: ["apps"]
    restart: unless-stopped
    environment:
      NODE_ENV: development
      TICKETLIVE_SERVICE: public-api
      PORT: 4002
      DATABASE_URL: postgres://ticketlive_public_api:${TICKETLIVE_PUBLIC_API_DB_PASSWORD:-local-public-api-password}@postgres:5432/${POSTGRES_DB:-ticket_live}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-random-secret-at-least-32-bytes-long}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      EVENT_SERVICE_URL: http://event-service:4003
      ORDER_SERVICE_URL: http://order-service:4005
      PUBLIC_API_EVENT_TOKEN: ${PUBLIC_API_EVENT_TOKEN:-local-public-api-event-token-change-me-32chars}
      PUBLIC_API_ORDER_TOKEN: ${PUBLIC_API_ORDER_TOKEN:-local-public-api-order-token-change-me-32chars}
      ORDER_SERVICE_TIMEOUT_MS: ${ORDER_SERVICE_TIMEOUT_MS:-45000}
    ports:
      - "127.0.0.1:4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
      event-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4002/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  elasticsearch_data:
  rabbitmq_data:
