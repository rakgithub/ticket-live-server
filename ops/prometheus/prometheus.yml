global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ticket-live-public-api
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:4002"]

  - job_name: ticket-live-order-service
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:4005"]

  - job_name: ticket-live-event-service
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:4003"]

  - job_name: ticket-live-email-service
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:4004"]

  - job_name: ticket-live-payment-service
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:4006"]

  - job_name: ticket-live-ticketing-service
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:4007"]

  - job_name: ticket-live-analytics-service
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:4008"]

  - job_name: ticket-live-rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_metrics]
      vhost: ["/"]
    static_configs:
      - targets: ["localhost:15692"]

rule_files:
  - alerts.yml
