groups:
  - name: ticket-live-phase-0
    rules:
      - alert: TicketLivePublicApiHighServerErrorRate
        expr: |
          sum(rate(http_server_requests_total{job="ticket-live-public-api",status_class="5xx"}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_total{job="ticket-live-public-api"}[5m])), 1)
          > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Ticket Live public API server error rate is above 1%
          description: Check the API logs using correlationId and traceId.

      - alert: TicketLiveCheckoutLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_server_request_duration_seconds_bucket{route="/orders/checkout"}[10m]))
          ) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Ticket Live checkout p95 is above 3 seconds
          description: The current synchronous mock-payment path is included in this latency.

      - alert: TicketLiveOutboxBacklogOld
        expr: ticketlive_outbox_oldest_age_seconds > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: An unpublished outbox row is older than one minute
          description: Inspect outbox event IDs, attempts, and last_error before replay.

      - alert: TicketLiveOrderStateStuck
        expr: ticketlive_orders_oldest_unresolved_age_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: An Order has remained unresolved for more than five minutes
          description: Check checkout attempts, payment state, Event hold state, and reconciliation logs.

      - alert: TicketLiveActiveHoldStuck
        expr: ticketlive_holds_oldest_active_age_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: An active inventory hold is older than five minutes
          description: This signal becomes available when the Event-owned hold table is introduced.

      - alert: TicketLiveRabbitDeadLetters
        expr: rabbitmq_detailed_queue_messages{queue="email.send.v1.dlq"} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: RabbitMQ has dead-lettered email jobs
          description: Inspect the DLQ reason and IDs, then use the replay runbook after fixing the cause.

      - alert: TicketLiveRabbitMetricsUnavailable
        expr: up{job="ticket-live-rabbitmq"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: RabbitMQ metrics are unavailable to Prometheus
          description: Check the rabbitmq_prometheus plugin, scrape target, and broker availability.

      - alert: TicketLiveEmailMetricsUnavailable
        expr: up{job="ticket-live-email-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Email service metrics are unavailable to Prometheus
          description: Check Email readiness, database access, and the metrics endpoint.

      - alert: TicketLiveOrderMetricsUnavailable
        expr: up{job="ticket-live-order-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Order service metrics are unavailable to Prometheus
          description: Check Order readiness, database access, and the metrics endpoint.

      - alert: TicketLiveEventMetricsUnavailable
        expr: up{job="ticket-live-event-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Event service metrics are unavailable to Prometheus
          description: Check Event readiness, its database/search access, and the metrics endpoint.

      - alert: TicketLiveEmailQueueOldMessage
        expr: time() - rabbitmq_detailed_queue_head_message_timestamp{queue=~"email.send.v1|email.send.v1.retry"} > 120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: An Email command has waited in RabbitMQ for more than two minutes
          description: Check Email consumer readiness, queue depth, and provider availability.

      - alert: TicketLiveEmailQueueDepth
        expr: rabbitmq_detailed_queue_messages{queue=~"email.send.v1|email.send.v1.retry"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Email commands have remained in RabbitMQ for five minutes
          description: Check the Email consumer, provider outcomes, and retry queue.

      - alert: TicketLiveEmailDeadLetterOldMessage
        expr: time() - rabbitmq_detailed_queue_head_message_timestamp{queue="email.send.v1.dlq"} > 300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: An Email dead letter has been waiting for operator review for more than five minutes
          description: Inspect and resolve the dead-letter reason; preserve commandId and notificationKey on replay.

      - alert: TicketLiveEmailQueueWithoutConsumer
        expr: |
          rabbitmq_detailed_queue_messages_ready{queue="email.send.v1"} > 0
          and on (queue) rabbitmq_detailed_queue_consumers{queue="email.send.v1"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Email commands are queued without an active consumer
          description: Check Email deployment readiness and RabbitMQ connectivity.

      - alert: TicketLiveEmailProviderFailure
        expr: sum(ticketlive_email_delivery_records{status="failed"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Email delivery rows have failed
          description: Review provider outcomes and attempts; use the audited replay procedure after the cause is fixed.

      - alert: TicketLiveEmailRetriesStalled
        expr: sum(ticketlive_email_active_retries) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Email deliveries remain in retry after provider attempts
          description: Check the retry queue, provider health, and recorded delivery attempts.

      - alert: TicketLiveEmailUnknownProviderOutcome
        expr: sum(ticketlive_email_unknown_provider_outcomes) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: An Email send has an unknown provider outcome
          description: Reconcile with the provider before replaying to avoid sending a duplicate confirmation.

      - alert: TicketLivePaymentHoldMismatch
        expr: increase(ticketlive_payment_hold_mismatch_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Payment and inventory hold state disagree
          description: Reconcile the affected order and hold before reporting checkout success.
