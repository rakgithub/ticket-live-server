asyncapi: 2.6.0
info:
  title: Ticket Live message contracts
  version: 1.0.0
  description: >-
    Order owns order.confirmed.v1 and the email.send.v1 command; Event owns
    event cancellation facts; Ticketing owns issued ticket records and delivery
    retries. Additive optional fields are backward compatible within v1:
    consumers ignore fields they do not know. Removing or changing a field's
    meaning requires a new schema version and a dual-read migration period.
defaultContentType: application/json
channels:
  booking-confirmation-email:
    description: Legacy durable queue drained by the Email service compatibility consumer. Disable that consumer only after this queue is empty.
    publish:
      operationId: publishOrderConfirmedV1
      message:
        $ref: '#/components/messages/OrderConfirmedV1'
  email.send.v1:
    description: Durable Order-to-Email command queue consumed by the Email service. Order publishes through the ticket-live.email direct exchange with the email.send.v1 routing key.
    publish:
      operationId: publishEmailSendV1
      message:
        $ref: '#/components/messages/EmailSendV1'
  ticketing.events.v1:
    description: Durable Order and Event facts consumed by Ticketing. Producers publish through the ticket-live.ticketing direct exchange with the ticketing.events.v1 routing key.
    publish:
      operationId: publishTicketingEventsV1
      message:
        $ref: '#/components/messages/TicketingEventV1'
components:
  messages:
    OrderConfirmedV1:
      name: order.confirmed.v1
      title: Order confirmed
      summary: Order-owned business fact retained for the legacy Email queue. New Email delivery uses email.send.v1; Ticketing receives a minimal projection without customer email or payment amounts.
      contentType: application/json
      headers:
        type: object
        properties:
          correlationId: { type: string, format: uuid }
          traceparent: { type: string, description: W3C Trace Context value. }
          tracestate: { type: string, maxLength: 512 }
      correlationId:
        location: '$message.header#/correlationId'
      payload:
        $ref: '#/components/schemas/OrderConfirmedV1'
      examples:
        - name: orderConfirmedExample
          payload:
            eventId: 3d05f1b6-15eb-4cc1-b4bd-00e18b936d5f
            eventType: order.confirmed
            schemaVersion: 1
            aggregateId: e637ca0a-0b5f-42ce-a070-bfa9c05aaf1a
            occurredAt: '2026-10-13T10:00:00Z'
            correlationId: 85ed0f48-269f-4adb-a9f1-80af110f5a19
            data:
              orderId: e637ca0a-0b5f-42ce-a070-bfa9c05aaf1a
              customer:
                name: Example Customer
                email: customer@example.com
              event:
                id: 1dc646c7-bd99-4bd5-9537-df2c61d23e96
                name: Example Concert
                location: Berlin
                startsAt: '2026-11-13T19:00:00Z'
              quantity: 2
              ticketPriceCents: 4000
              totalAmountCents: 8000
              currencyCode: EUR
    EmailSendV1:
      name: email.send.v1
      title: Send email
      summary: Order-to-Email command. Email owns delivery and deduplication by notificationKey, which is unique in Email's inbox table.
      contentType: application/json
      headers:
        type: object
        properties:
          correlationId: { type: string, format: uuid }
          traceparent: { type: string, description: W3C Trace Context value. }
          tracestate: { type: string, maxLength: 512 }
      correlationId:
        location: '$message.header#/correlationId'
      payload:
        $ref: '#/components/schemas/EmailSendV1'
      examples:
        - name: emailSendExample
          payload:
            commandId: 97e911ad-0317-4619-a057-f52c99131281
            commandType: email.send
            schemaVersion: 1
            notificationKey: order-confirmation:e637ca0a-0b5f-42ce-a070-bfa9c05aaf1a
            templateId: order-confirmation-v1
            recipient: customer@example.com
            data:
              orderId: e637ca0a-0b5f-42ce-a070-bfa9c05aaf1a
              customerName: Example Customer
              eventName: Example Concert
              eventLocation: Berlin
              eventStartsAt: '2026-11-13T19:00:00Z'
              quantity: 2
              totalAmountCents: 8000
              currencyCode: EUR
              ticketsUrl: 'http://localhost:3000/my-tickets'
    TicketingEventV1:
      name: ticketing.events.v1
      title: Ticketing domain event
      summary: Order confirmation issues tickets; event cancellation or deletion invalidates active tickets.
      contentType: application/json
      headers:
        type: object
        properties:
          correlationId: { type: string, format: uuid }
          traceparent: { type: string, description: W3C Trace Context value. }
          tracestate: { type: string, maxLength: 512 }
      correlationId:
        location: '$message.header#/correlationId'
      payload:
        $ref: '#/components/schemas/TicketingEventV1'
      examples:
        - name: ticketingOrderConfirmedExample
          payload:
            eventId: 3d05f1b6-15eb-4cc1-b4bd-00e18b936d5f
            eventType: order.confirmed
            schemaVersion: 1
            aggregateId: e637ca0a-0b5f-42ce-a070-bfa9c05aaf1a
            occurredAt: '2026-10-13T10:00:00Z'
            correlationId: 85ed0f48-269f-4adb-a9f1-80af110f5a19
            data:
              orderId: e637ca0a-0b5f-42ce-a070-bfa9c05aaf1a
              customer:
                name: Example Customer
              event:
                id: 1dc646c7-bd99-4bd5-9537-df2c61d23e96
                name: Example Concert
                location: Berlin
                startsAt: '2026-11-13T19:00:00Z'
              quantity: 2
        - name: eventCancelledExample
          payload:
            eventId: 07c6d1f4-6e33-42f2-94e9-8eb61f17f4e1
            eventType: event.cancelled
            schemaVersion: 1
            aggregateId: 1dc646c7-bd99-4bd5-9537-df2c61d23e96
            occurredAt: '2026-10-14T12:00:00Z'
            correlationId: 85ed0f48-269f-4adb-a9f1-80af110f5a19
            data:
              eventId: 1dc646c7-bd99-4bd5-9537-df2c61d23e96
              version: 2
  schemas:
    OrderConfirmedV1:
      type: object
      additionalProperties: true
      required: [eventId, eventType, schemaVersion, aggregateId, occurredAt, correlationId, data]
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string, const: order.confirmed }
        schemaVersion: { type: integer, const: 1 }
        aggregateId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string, format: uuid }
        data:
          type: object
          additionalProperties: true
          required: [orderId, customer, event, quantity, ticketPriceCents, totalAmountCents, currencyCode]
          properties:
            orderId: { type: string, format: uuid }
            customer:
              type: object
              additionalProperties: true
              required: [name, email]
              properties:
                name: { type: string, minLength: 1 }
                email: { type: string, format: email }
            event:
              type: object
              additionalProperties: true
              required: [id, name, location, startsAt]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                location: { type: string }
                startsAt: { type: string, format: date-time }
            quantity: { type: integer, minimum: 1 }
            ticketPriceCents: { type: integer, minimum: 0, description: Unit price captured by Event when the hold was created. }
            totalAmountCents: { type: integer, minimum: 0, description: Must equal quantity multiplied by ticketPriceCents. }
            currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
    TicketingOrderConfirmedV1:
      type: object
      additionalProperties: true
      required: [eventId, eventType, schemaVersion, aggregateId, occurredAt, correlationId, data]
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string, const: order.confirmed }
        schemaVersion: { type: integer, const: 1 }
        aggregateId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string, format: uuid }
        data:
          type: object
          additionalProperties: true
          required: [orderId, customer, event, quantity]
          properties:
            orderId: { type: string, format: uuid }
            customer:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1 }
            event:
              type: object
              required: [id, name, location, startsAt]
              properties:
                id: { type: string, format: uuid }
                name: { type: string, minLength: 1 }
                location: { type: string }
                startsAt: { type: string, format: date-time }
            quantity: { type: integer, minimum: 1 }
    EmailSendV1:
      type: object
      additionalProperties: true
      required: [commandId, commandType, schemaVersion, notificationKey, templateId, recipient, data]
      properties:
        commandId: { type: string, format: uuid }
        commandType: { type: string, const: email.send }
        schemaVersion: { type: integer, const: 1 }
        notificationKey: { type: string, minLength: 1, maxLength: 255, description: 'Stable Email inbox deduplication key; order confirmations use order-confirmation:{orderId}.' }
        templateId: { type: string, minLength: 1 }
        recipient: { type: string, format: email }
        data:
          type: object
          additionalProperties: true
          required: [orderId, customerName, eventName, eventLocation, eventStartsAt, quantity, totalAmountCents, currencyCode]
          properties:
            orderId: { type: string, format: uuid }
            customerName: { type: string, minLength: 1 }
            eventName: { type: string, minLength: 1 }
            eventLocation: { type: string, minLength: 1 }
            eventStartsAt: { type: string, format: date-time }
            quantity: { type: integer, minimum: 1 }
            totalAmountCents: { type: integer, minimum: 0, description: Integer amount in currencyCode minor units. }
            currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
            ticketsUrl: { type: string, format: uri, description: Configured customer portal link. Optional for older messages. }
    EventTicketInvalidationV1:
      type: object
      additionalProperties: true
      required: [eventId, eventType, schemaVersion, aggregateId, occurredAt, correlationId, data]
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string, enum: [event.cancelled, event.deleted] }
        schemaVersion: { type: integer, const: 1 }
        aggregateId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string, format: uuid }
        data:
          type: object
          required: [eventId, version]
          properties:
            eventId: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
    TicketingEventV1:
      oneOf:
        - $ref: '#/components/schemas/TicketingOrderConfirmedV1'
        - $ref: '#/components/schemas/EventTicketInvalidationV1'
