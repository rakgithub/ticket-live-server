openapi: 3.1.0
info:
  title: Ticket Live public API
  version: 1.0.0
  description: >-
    Current public behavior recorded before service extraction. Every response
    includes the x-correlation-id response header; callers may provide that UUID
    on requests to connect logs and traces. Message compatibility rules are in
    AsyncAPI: additive optional fields are allowed within a version; breaking
    changes use a new version and a dual-read migration. The /internal paths are
    service-only interfaces and must not be exposed to browsers.
servers:
  - url: http://localhost:4002
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      operationId: healthLiveness
      security: []
      summary: Check whether the API process is running
      responses:
        '200':
          description: Process is live.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /health/ready:
    get:
      operationId: healthReadiness
      security: []
      summary: Check API database and service dependencies
      description: The public API checks PostgreSQL, Event, Order, and Ticketing readiness endpoints.
      responses:
        '200':
          description: PostgreSQL, Event, Order, and Ticketing services are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: One or more required dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /chat/events/stream:
    post:
      operationId: streamEventSearch
      summary: Search events from a natural-language request
      description: >-
        Streams status, results, delta, done, or error SSE frames. The done
        frame's finishReason is completed, empty, unsupported, or clarification.
        Returned event cards are sourced from Event's catalog and checked against
        supported genre and location criteria.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventChatRequest'
      responses:
        '200':
          description: Server-sent event stream. A clarification finish returns no event cards.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                clarification:
                  value: |-
                    event: done
                    data: {"requestId":"...","finishReason":"clarification"}
        '400':
          description: Invalid chat request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '429':
          description: Chat rate or concurrent stream limit exceeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '503':
          description: Event chat is not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
  /events:
    get:
      operationId: listEvents
      summary: List non-deleted events
      responses:
        '200':
          description: Current event records read from PostgreSQL.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
    post:
      operationId: createEvent
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Event created and queued for indexing.
          content:
            application/json:
              schema:
                type: object
                required: [event]
                properties:
                  event:
                    $ref: '#/components/schemas/Event'
        '400':
          description: Invalid event details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
  /orders:
    get:
      operationId: listOrders
      summary: List the authenticated user's orders
      description: Returns all orders owned by the authenticated user, newest first. Customer email and payment gateway identifiers are not included.
      responses:
        '200':
          description: The user's order summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '503':
          description: Order service is unavailable or not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
  /orders/checkout:
    post:
      operationId: checkout
      summary: Create and synchronously confirm a ticket order
      description: The current mock payment flow returns only after confirmation.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: Reusing the key with the same body after completion returns the original result. A concurrent retry while processing, or reuse with a different body, returns 409.
        - in: header
          name: x-correlation-id
          required: false
          schema:
            type: string
            format: uuid
        - in: header
          name: traceparent
          required: false
          schema:
            type: string
            pattern: '^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
            example:
              eventId: 1dc646c7-bd99-4bd5-9537-df2c61d23e96
              quantity: 2
      responses:
        '201':
          description: Order is confirmed and the mock payment succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          description: Invalid checkout body or missing/invalid Idempotency-Key header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '404':
          description: Event is missing, deleted, or cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '409':
          description: Capacity is exhausted, payment is declined, reservation expired, or the idempotency key was reused with a different request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '500':
          description: Checkout failed before its outcome could be persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '503':
          description: The Event response or checkout outcome is uncertain. Retry with the same Idempotency-Key while Order reconciles the hold and payment state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
  /tickets:
    get:
      operationId: listTickets
      summary: List tickets for the authenticated user's confirmed orders
      description: The Public API verifies order ownership with Order before fetching matching ticket records from Ticketing. Ticket records do not include QR tokens or QR image data.
      responses:
        '200':
          description: Tickets owned by the authenticated user, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketListResponse' }
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '503':
          description: Order or Ticketing service is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
  /internal/orders/checkout:
    servers:
      - url: http://localhost:4005
    post:
      operationId: orderServiceCheckout
      security: [{ serviceBearerAuth: [] }]
      summary: Run checkout for the authenticated API gateway
      description: The public API sends an identity-verified customer snapshot. This route must stay on a private service network.
      parameters:
        - in: header
          name: x-actor-user-id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
        - in: header
          name: x-correlation-id
          required: false
          schema: { type: string, format: uuid }
        - in: header
          name: traceparent
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternalCheckoutRequest' }
      responses:
        '201':
          description: Checkout is confirmed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResponse' }
        '400': { description: Invalid checkout request. }
        '401': { description: Missing or invalid service credentials. }
        '404': { description: Customer or event is unavailable. }
        '409': { description: Capacity, payment, or idempotency conflict. }
        '503': { description: Checkout outcome is uncertain; retry with the same Idempotency-Key. }
  /internal/orders:
    servers:
      - url: http://localhost:4005
    get:
      operationId: orderServiceListOrders
      security: [{ serviceBearerAuth: [] }]
      summary: List orders for an authenticated API user
      description: Private API-to-Order endpoint. The actor ID must come from the Public API's verified user token.
      parameters:
        - in: header
          name: x-actor-user-id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: x-correlation-id
          required: false
          schema: { type: string, format: uuid }
        - in: header
          name: traceparent
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Orders belonging to the supplied actor, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderListResponse' }
        '400': { description: Invalid actor user ID. }
        '401': { description: Missing or invalid service credentials. }
        '503': { description: Internal service authentication is not configured. }
  /internal/payments:
    servers:
      - url: http://localhost:4006
    post:
      operationId: paymentServiceCharge
      security: [{ serviceBearerAuth: [] }]
      summary: Create or retrieve an idempotent payment for an order
      description: Private Order-to-Payment endpoint. The stable Order ID is the payment idempotency key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternalPaymentChargeRequest' }
      responses:
        '200':
          description: Payment state for this order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalPaymentRecord' }
        '400': { description: Invalid payment request. }
        '401': { description: Missing or invalid service credentials. }
        '409': { description: Order already has a payment with different amount details. }
  /internal/tickets/query:
    servers:
      - url: http://localhost:4007
    post:
      operationId: ticketingServiceListTickets
      security: [{ serviceBearerAuth: [] }]
      summary: List tickets for order IDs verified by the Public API
      description: Private Public API-to-Ticketing route. The Public API must supply only order IDs returned for its authenticated actor by Order.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternalTicketQueryRequest' }
      responses:
        '200':
          description: Tickets for the supplied orders.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketListResponse' }
        '400': { description: Invalid order ID list. }
        '401': { description: Missing or invalid service credentials. }
  /internal/tickets/check-in:
    servers:
      - url: http://localhost:4007
    post:
      operationId: ticketingServiceCheckIn
      security: [{ serviceBearerAuth: [] }]
      summary: Mark an active ticket as used
      description: Private scanner route authenticated with the dedicated TICKETING_CHECK_IN_TOKEN. It accepts a ticket ID and event ID; repeated check-in returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketCheckInRequest' }
      responses:
        '200':
          description: Ticket was checked in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketCheckInResponse' }
        '400': { description: Invalid check-in request. }
        '401': { description: Missing or invalid service credentials. }
        '404': { description: Ticket not found for the supplied event. }
        '409': { description: Ticket has already been checked in or is invalid. }
  /internal/payments/{orderId}:
    servers:
      - url: http://localhost:4006
    parameters:
      - in: path
        name: orderId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: paymentServiceGetByOrder
      security: [{ serviceBearerAuth: [] }]
      summary: Get payment state by Order ID
      responses:
        '200':
          description: Payment state for this order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalPaymentRecord' }
        '401': { description: Missing or invalid service credentials. }
        '404': { description: Payment not found. }
  /internal/payments/{orderId}/cancel:
    servers:
      - url: http://localhost:4006
    parameters:
      - in: path
        name: orderId
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: paymentServiceCancel
      security: [{ serviceBearerAuth: [] }]
      summary: Cancel a pending payment for an expired order
      responses:
        '200':
          description: Current payment state after the cancellation request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalPaymentRecord' }
        '401': { description: Missing or invalid service credentials. }
        '404': { description: Payment not found. }
  /events/search:
    get:
      operationId: searchEvents
      summary: Search the Elasticsearch event index
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Ranked event documents from the eventually consistent index.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventSearchResult'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
  /internal/events:
    servers:
      - url: http://localhost:4003
    get:
      operationId: eventServiceListEvents
      security: [{ serviceBearerAuth: [] }]
      summary: List Event-owned catalog entries for trusted callers
      responses:
        '200':
          description: Non-deleted events ordered by start time.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/Event' } }
        '401': { description: Missing or invalid service credentials. }
    post:
      operationId: eventServiceCreateEvent
      security: [{ serviceBearerAuth: [] }]
      summary: Create an Event-owned catalog entry
      parameters:
        - in: header
          name: x-actor-user-id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEventRequest' }
      responses:
        '201':
          description: Event created with its search-index outbox row.
          content:
            application/json:
              schema:
                type: object
                required: [event]
                properties:
                  event: { $ref: '#/components/schemas/Event' }
        '400': { description: Invalid event input or actor ID. }
        '401': { description: Missing or invalid service credentials. }
  /internal/events/search:
    servers:
      - url: http://localhost:4003
    get:
      operationId: eventServiceSearchEvents
      security: [{ serviceBearerAuth: [] }]
      summary: Search the Event-owned Elasticsearch index
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Ranked documents from the Event search index.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/EventSearchResult' } }
        '401': { description: Missing or invalid service credentials. }
  /internal/events/{eventId}:
    servers:
      - url: http://localhost:4003
    patch:
      operationId: eventServiceUpdateEvent
      security: [{ serviceBearerAuth: [] }]
      summary: Update an Event-owned catalog entry
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: x-actor-user-id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                description: { type: string, minLength: 1 }
                location: { type: string, minLength: 1, maxLength: 255 }
                genre: { $ref: '#/components/schemas/EventGenre' }
                minPeople: { type: integer, minimum: 1 }
                maxPeople: { type: integer, minimum: 1 }
                ticketPriceCents: { type: integer, minimum: 0 }
                currencyCode: { type: string, pattern: '^[A-Za-z]{3}$' }
                servesAlcohol: { type: boolean }
                startsAt: { type: string, format: date-time }
      responses:
        '200': { description: Updated Event with an incremented index version. }
        '400': { description: Invalid event input or actor ID. }
        '409': { description: The update would violate event capacity constraints. }
        '401': { description: Missing or invalid service credentials. }
        '404': { description: Event was not found for the supplied actor. }
    delete:
      operationId: eventServiceDeleteEvent
      security: [{ serviceBearerAuth: [] }]
      summary: Soft-delete an Event-owned catalog entry
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: x-actor-user-id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Event deletion was committed to the Event outbox. }
        '401': { description: Missing or invalid service credentials. }
        '404': { description: Event was not found for the supplied actor. }
  /internal/events/{eventId}/cancel:
    servers:
      - url: http://localhost:4003
    post:
      operationId: eventServiceCancelEvent
      security: [{ serviceBearerAuth: [] }]
      summary: Cancel an Event and prevent new inventory holds
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: x-actor-user-id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Event cancellation was committed to the Event outbox. }
        '401': { description: Missing or invalid service credentials. }
        '404': { description: Event was not found for the supplied actor. }
  /internal/event-search:
    servers:
      - url: http://localhost:4003
    get:
      operationId: eventServiceSearchCandidates
      security: [{ serviceBearerAuth: [] }]
      summary: Return ranked candidate IDs for event chat
      parameters:
        - in: query
          name: text
          schema: { type: string, minLength: 1, maxLength: 120 }
        - in: query
          name: location
          schema: { type: string, minLength: 1, maxLength: 120 }
        - in: query
          name: genre
          schema: { type: string, enum: [blues, classical, country, electronic, folk, funk, hip-hop, jazz, metal, pop, punk, reggae, rock, soul] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: Candidate event IDs in search order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalEventSearchCandidatesResponse'
        '401': { description: Missing or invalid service credentials. }
  /internal/event-cards:
    servers:
      - url: http://localhost:4003
    get:
      operationId: eventServiceHydrateChatCards
      security: [{ serviceBearerAuth: [] }]
      summary: Refresh ranked event candidates from Event-owned data
      parameters:
        - in: query
          name: ids
          required: true
          description: Comma-separated event UUIDs in search rank order.
          schema: { type: string }
        - in: query
          name: genre
          schema: { type: string, enum: [blues, classical, country, electronic, folk, funk, hip-hop, jazz, metal, pop, punk, reggae, rock, soul] }
        - in: query
          name: location
          schema: { type: string, minLength: 1, maxLength: 120 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 10 }
      responses:
        '200':
          description: Fresh, active event cards in candidate order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalEventChatCardsResponse'
        '401': { description: Missing or invalid service credentials. }
  /internal/events/{eventId}/holds:
    servers:
      - url: http://localhost:4003
    post:
      operationId: createInventoryHold
      security:
        - serviceBearerAuth: []
      summary: Create or retrieve an idempotent event inventory hold
      description: The orderId is the stable idempotency key and equals the returned holdId, so callers can use it to query after a lost response. Event locks the event row and snapshots its current unit price and currency when creating the hold; retries return that same snapshot even if catalog pricing later changes. Existing holds can be retrieved after event cancellation; new holds are rejected.
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          description: Must equal the orderId in the request body and be reused for every retry.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryHoldCreateRequest'
      responses:
        '201':
          description: A new hold was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryHoldResponse' }
        '200':
          description: The matching hold already existed; this response is safe for a retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryHoldResponse' }
        '400':
          description: Invalid request or idempotency key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '401':
          description: Missing or invalid service credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '404':
          description: Event is missing, deleted, or cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '409':
          description: Capacity is exhausted or the orderId was reused for different hold details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '500':
          description: Inventory operation failed unexpectedly.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '503':
          description: Internal service authentication is not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
  /internal/holds/{holdId}/confirm:
    servers:
      - url: http://localhost:4003
    post:
      operationId: confirmInventoryHold
      security:
        - serviceBearerAuth: []
      summary: Confirm a held inventory reservation
      parameters:
        - in: path
          name: holdId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Hold was confirmed or was already confirmed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryHoldResponse' }
        '400':
          description: Invalid hold ID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '401':
          description: Missing or invalid service credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '404':
          description: Hold does not exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '409':
          description: Hold expired, was released, or cannot be confirmed in its current state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '500':
          description: Inventory operation failed unexpectedly.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '503':
          description: Internal service authentication is not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
  /internal/holds/{holdId}/release:
    servers:
      - url: http://localhost:4003
    post:
      operationId: releaseInventoryHold
      security:
        - serviceBearerAuth: []
      summary: Release an active inventory reservation
      parameters:
        - in: path
          name: holdId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Hold was released or was already released or expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryHoldResponse' }
        '400':
          description: Invalid hold ID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '401':
          description: Missing or invalid service credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '404':
          description: Hold does not exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '409':
          description: A confirmed hold cannot be released.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '500':
          description: Inventory operation failed unexpectedly.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '503':
          description: Internal service authentication is not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
  /internal/holds/{holdId}:
    servers:
      - url: http://localhost:4003
    get:
      operationId: getInventoryHold
      security:
        - serviceBearerAuth: []
      summary: Get an inventory hold and its current state
      description: holdId equals the orderId supplied when the hold was created.
      parameters:
        - in: path
          name: holdId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current inventory hold state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryHoldResponse' }
        '400':
          description: Invalid hold ID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '401':
          description: Missing or invalid service credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '404':
          description: Hold does not exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '500':
          description: Inventory operation failed unexpectedly.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '503':
          description: Internal service authentication is not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
  /internal/deliveries/{notificationKey}:
    servers:
      - url: http://localhost:4004
    get:
      operationId: getEmailDelivery
      security:
        - serviceBearerAuth: []
      summary: Get delivery status for an Email notification
      description: Returns delivery metadata without exposing the recipient address or message body.
      parameters:
        - in: path
          name: notificationKey
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '200':
          description: Current Email delivery state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailDeliveryResponse' }
        '400':
          description: Invalid notification key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '401':
          description: Missing or invalid service credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '404':
          description: No delivery exists for this notification key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '500':
          description: Email delivery lookup failed unexpectedly.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
        '503':
          description: Internal service authentication is not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HttpError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque service token
  schemas:
    CheckoutRequest:
      type: object
      required: [eventId, quantity]
      properties:
        eventId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 10000
    OrderListResponse:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items: { $ref: '#/components/schemas/OrderSummary' }
    OrderSummary:
      type: object
      required: [id, eventId, event, quantity, status, ticketPriceCents, currencyCode, totalAmountCents, expiresAt, paymentStatus, createdAt]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        event:
          type: object
          required: [name, location, startsAt]
          properties:
            name: { type: string }
            location: { type: string }
            startsAt: { type: string, format: date-time }
        quantity: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [initiated, held, pending_payment, confirmed, cancelled, expired, reconciliation_required]
        ticketPriceCents: { type: integer, minimum: 0 }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
        totalAmountCents: { type: integer, minimum: 0 }
        expiresAt: { type: [string, 'null'], format: date-time }
        paymentStatus:
          type: [string, 'null']
          enum: [pending, succeeded, failed, cancelled, refunded, null]
        createdAt: { type: string, format: date-time }
    TicketStatus:
      type: string
      enum: [active, used, cancelled, refunded]
    Ticket:
      type: object
      required: [id, orderId, eventId, ticketNumber, holderName, eventName, eventLocation, eventStartsAt, status, issuedAt, checkInAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        ticketNumber: { type: integer, minimum: 1 }
        holderName: { type: string }
        eventName: { type: string }
        eventLocation: { type: string }
        eventStartsAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/TicketStatus' }
        issuedAt: { type: string, format: date-time }
        checkInAt: { type: [string, 'null'], format: date-time }
    TicketListResponse:
      type: object
      required: [tickets]
      properties:
        tickets:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }
    InternalTicketQueryRequest:
      type: object
      required: [orderIds]
      properties:
        orderIds:
          type: array
          maxItems: 500
          items: { type: string, format: uuid }
    TicketCheckInRequest:
      type: object
      required: [ticketId, eventId]
      properties:
        ticketId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
    TicketCheckInResponse:
      type: object
      required: [ticket]
      properties:
        ticket: { $ref: '#/components/schemas/Ticket' }
    InternalCheckoutRequest:
      type: object
      required: [eventId, quantity, customer]
      properties:
        eventId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 10000 }
        customer:
          type: object
          required: [name, email]
          properties:
            name: { type: string, minLength: 1, maxLength: 255 }
            email: { type: string, format: email }
    InternalPaymentChargeRequest:
      type: object
      required: [orderId, amountCents, currencyCode]
      properties:
        orderId: { type: string, format: uuid }
        amountCents: { type: integer, minimum: 0 }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
    InternalPaymentRecord:
      type: object
      required: [id, orderId, status, gateway]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        status: { type: string, enum: [pending, succeeded, failed, cancelled, refunded] }
        gateway: { type: string }
    CheckoutResponse:
      type: object
      required: [event, order, payment]
      properties:
        event:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        order:
          type: object
          required: [id, eventId, quantity, status, ticketPriceCents, currencyCode, totalAmountCents, expiresAt, createdAt]
          properties:
            id: { type: string, format: uuid }
            eventId: { type: string, format: uuid }
            quantity: { type: integer, minimum: 1 }
            status: { type: string, const: confirmed }
            ticketPriceCents: { type: integer, minimum: 0, description: Unit price snapshotted by Event when it created the inventory hold. }
            currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
            totalAmountCents: { type: integer, minimum: 0, description: Must equal quantity multiplied by ticketPriceCents; amount is in currencyCode minor units. }
            expiresAt: { type: 'null' }
            createdAt: { type: string, format: date-time }
        payment:
          type: object
          required: [id, status, gateway]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, const: succeeded }
            gateway: { type: string, const: mock }
    InventoryHoldCreateRequest:
      type: object
      required: [orderId, quantity]
      properties:
        orderId:
          type: string
          format: uuid
          description: Stable idempotency key; send the same value in Idempotency-Key on every retry.
        quantity: { type: integer, minimum: 1, maximum: 10000 }
    InventoryHold:
      type: object
      required: [holdId, orderId, eventId, eventNameSnapshot, eventLocationSnapshot, quantity, unitPriceCents, currencyCode, eventStartsAtSnapshot, state, expiresAt, createdAt, updatedAt]
      properties:
        holdId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        eventNameSnapshot: { type: string, minLength: 1 }
        eventLocationSnapshot: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPriceCents: { type: integer, minimum: 0 }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
        eventStartsAtSnapshot: { type: string, format: date-time }
        state: { type: string, enum: [active, confirmed, released, expired] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InventoryHoldResponse:
      type: object
      required: [hold]
      properties:
        hold:
          $ref: '#/components/schemas/InventoryHold'
    EventSearchResult:
      type: object
      required: [id, name, description, location, genre, minPeople, maxPeople, reservedQuantity, ticketPriceCents, currencyCode, servesAlcohol, isCancelled, userId, startsAt, createdAt, updatedAt, score]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        location: { type: string }
        genre: { $ref: '#/components/schemas/EventGenre' }
        minPeople: { type: integer }
        maxPeople: { type: integer }
        reservedQuantity: { type: integer }
        startsAt: { type: string, format: date-time }
        ticketPriceCents: { type: integer, minimum: 0 }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
        servesAlcohol: { type: boolean }
        isCancelled: { type: boolean }
        userId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        score: { type: [number, 'null'] }
    EventSearchCandidate:
      type: object
      required: [id, score]
      properties:
        id: { type: string, format: uuid }
        score: { type: [number, 'null'] }
    InternalEventSearchCandidatesResponse:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/EventSearchCandidate'
    EventChatCard:
      type: object
      required: [id, name, descriptionPreview, location, genre, startsAt, ticketPriceCents, currencyCode, minPeople, maxPeople, servesAlcohol]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        descriptionPreview: { type: string }
        location: { type: string }
        genre: { $ref: '#/components/schemas/EventGenre' }
        startsAt: { type: string, format: date-time }
        ticketPriceCents: { type: integer, minimum: 0 }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
        minPeople: { type: integer, minimum: 1 }
        maxPeople: { type: integer, minimum: 1 }
        servesAlcohol: { type: boolean }
    InternalEventChatCardsResponse:
      type: object
      required: [cards]
      properties:
        cards:
          type: array
          items:
            $ref: '#/components/schemas/EventChatCard'
    EventGenre:
      type: [string, 'null']
      enum: [blues, classical, country, electronic, folk, funk, hip-hop, jazz, metal, pop, punk, reggae, rock, soul, null]
      description: A supported music genre label. Null means the event has not been classified.
    EventChatRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 500 }
        limit: { type: integer, minimum: 1, maximum: 10, default: 5 }
    EventChatFinishReason:
      type: string
      enum: [completed, empty, unsupported, clarification]
    Event:
      type: object
      required: [id, name, description, location, genre, minPeople, maxPeople, reservedQuantity, ticketPriceCents, currencyCode, servesAlcohol, isCancelled, userId, startsAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        location: { type: string }
        genre: { $ref: '#/components/schemas/EventGenre' }
        minPeople: { type: integer }
        maxPeople: { type: integer }
        reservedQuantity: { type: integer }
        ticketPriceCents: { type: integer, minimum: 0 }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
        servesAlcohol: { type: boolean }
        isCancelled: { type: boolean }
        userId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateEventRequest:
      type: object
      required: [name, description, location, minPeople, maxPeople, ticketPriceCents, currencyCode, startsAt]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, minLength: 1 }
        location: { type: string, minLength: 1, maxLength: 255 }
        genre: { $ref: '#/components/schemas/EventGenre' }
        minPeople: { type: integer, minimum: 1 }
        maxPeople: { type: integer, minimum: 1 }
        ticketPriceCents: { type: integer, minimum: 0 }
        currencyCode:
          type: string
          pattern: '^[A-Za-z]{3}$'
          description: Lowercase input is accepted and normalized to uppercase.
        servesAlcohol: { type: boolean, default: false }
        startsAt: { type: string, format: date-time }
    HttpError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          required: [postgres, eventService, orderService, ticketingService]
          properties:
            postgres: { type: boolean }
            eventService: { type: boolean }
            orderService: { type: boolean }
            ticketingService: { type: boolean }
    EmailDeliveryStatus:
      type: string
      enum: [queued, sending, accepted_by_provider, delivered, bounced, failed, simulated]
    EmailDeliveryResponse:
      type: object
      required: [delivery]
      properties:
        delivery:
          type: object
          required: [id, notificationKey, orderId, status, providerName, providerMessageId, providerAcceptedAt, deliveredAt, bouncedAt, failedAt, attempts, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            notificationKey: { type: string, minLength: 1 }
            orderId: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/EmailDeliveryStatus' }
            providerName: { type: [string, 'null'] }
            providerMessageId: { type: [string, 'null'] }
            providerAcceptedAt: { type: [string, 'null'], format: date-time }
            deliveredAt: { type: [string, 'null'], format: date-time }
            bouncedAt: { type: [string, 'null'], format: date-time }
            failedAt: { type: [string, 'null'], format: date-time }
            attempts: { type: integer, minimum: 0 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
