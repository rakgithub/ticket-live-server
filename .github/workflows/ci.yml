name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

env:
  DATABASE_URL: postgres://ticketlive:ci-password@127.0.0.1:5432/ticket_live
  ORDER_SERVICE_DATABASE_URL: postgres://ticketlive:ci-password@127.0.0.1:5432/ticket_live
  EVENT_SERVICE_DATABASE_URL: postgres://ticketlive:ci-password@127.0.0.1:5432/ticket_live
  EMAIL_SERVICE_DATABASE_URL: postgres://ticketlive:ci-password@127.0.0.1:5432/ticket_live
  PAYMENT_SERVICE_DATABASE_URL: postgres://ticketlive:ci-password@127.0.0.1:5432/ticket_live
  TICKETING_SERVICE_DATABASE_URL: postgres://ticketlive:ci-password@127.0.0.1:5432/ticket_live

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository-wide checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Enable pnpm
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  app-tests:
    name: Tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app:
          - public-api
          - event-service
          - order-service
          - payment-service
          - email-service
          - ticketing-service
          - analytics-service
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Enable pnpm
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Run service tests
        run: pnpm --filter "@ticket-live/${{ matrix.app }}" test

  integration:
    name: Public API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Enable pnpm
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:public-api:integration

  container:
    name: Container and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build application image
        run: docker build --target runtime -t ticket-live-app:ci .
      - name: Build migration image
        run: docker build --target migrations -t ticket-live-migrations:ci .
